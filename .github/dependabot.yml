version: 2

registries:
  artifactory-python:
    type: python-index
    url: https://cognite.jfrog.io/cognite/api/pypi/snakepit/simple
    username: ${{secrets.ARTIFACTORY_READONLY_TOKEN_USER}}
    password: ${{secrets.ARTIFACTORY_READONLY_TOKEN}}

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    registries:
      - artifactory-python
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
